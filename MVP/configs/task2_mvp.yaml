# Task 2: 0.1T -> 1.5T/3T/5T/7T.
seed: 2026
device: cuda
output_dir: ./MVP/runs/task2_mvp
train_manifests:
  - ./MVP/work/manifests/task2_real_train.csv
  - ./MVP/work/synthetic_task2/synthetic_manifest_task2.csv
val_manifests: []
batch_size: 1
num_workers: 4
epochs: 100
save_every: 10
lr: 2.0e-4
weight_decay: 1.0e-4
amp: true
model:
  in_ch: 1
  out_ch: 1
  base_ch: 16
  levels: 4
  cond_dim: 128
  use_coords: true
  dropout: 0.0
data:
  patch_size: [64, 96, 96]
  samples_per_volume: 8
  val_samples_per_volume: 1
  cache_items: 4
  foreground_prob: 0.8
loss:
  l1: 1.0
  nrmse: 0.60
  ssim: 0.20
  lpips: 0.015
loss_slice_axis: 2
lpips_net: alex
