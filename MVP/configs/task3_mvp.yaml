# Task 3: unified any-to-any. This is a single conditional model.
seed: 2026
device: cuda
output_dir: ./MVP/runs/task3_mvp
train_manifests:
  - ./MVP/work/manifests/task3_real_train.csv
  - ./MVP/work/synthetic_task3/synthetic_manifest_task3.csv
val_manifests: []
batch_size: 1
num_workers: 4
epochs: 120
save_every: 10
lr: 2.0e-4
weight_decay: 1.0e-4
amp: true
model:
  in_ch: 1
  out_ch: 1
  base_ch: 16
  levels: 4
  cond_dim: 128
  use_coords: true
  dropout: 0.0
data:
  patch_size: [64, 96, 96]
  samples_per_volume: 6
  val_samples_per_volume: 1
  cache_items: 4
  foreground_prob: 0.8
loss:
  l1: 1.0
  nrmse: 0.50
  ssim: 0.20
  lpips: 0.03
loss_slice_axis: 2
lpips_net: alex
